services:
  db:
    image: mysql:8.0
    container_name: videojuegos_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: juegos
      MYSQL_USER: videojuegos_user
      MYSQL_PASSWORD: videojuegos_pass
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    container_name: videojuegos_flask_prod
    restart: always
    ports:
      - "80:8000"
    environment:
      SECRET_KEY: "clave-secreta-produccion-videojuegos-2026"
      DATABASE_URL: "mysql+pymysql://videojuegos_user:videojuegos_pass@db:3306/juegos"
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
